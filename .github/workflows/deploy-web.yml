# Builds the Godot web export and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:        # build and check only, never deploys
  workflow_dispatch:   # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the web export template from cache
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-web-4.7.2

      - name: Install Godot (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$GODOT_RELEASE_URL/$ZIP"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_RELEASE_URL/SHA512-SUMS.txt"
          awk -v f="$ZIP" '$2==f {print $1"  godot.zip"}' SHA512-SUMS.txt | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install the single-threaded web template (only when not cached)
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o templates.tpz "$GODOT_RELEASE_URL/$TPZ"   # about 1.3 GB
          awk -v f="$TPZ" '$2==f {print $1"  templates.tpz"}' SHA512-SUMS.txt | sha512sum -c -
          mkdir -p "$DEST"
          unzip -j -q templates.tpz '*web_nothreads_release.zip' -d "$DEST"
          unzip -j -q templates.tpz '*version.txt' -d "$DEST" || true
          rm templates.tpz

      - name: Import the project
        run: |
          # A fresh clone has no .godot cache. Godot can exit 139 on the very first
          # import even after it finished, so run it once more and let that run decide.
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Export the web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Check the build
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f" || { echo "missing build/web/$f"; exit 1; }
          done
          grep -aq 'jump_tuning.json' build/web/index.pck \
            || { echo "jump_tuning.json is not in the pack"; exit 1; }
          if grep -aq 'PThread' build/web/index.js; then
            echo "threaded build: GitHub Pages cannot serve it"; exit 1
          fi
          du -sh build/web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
